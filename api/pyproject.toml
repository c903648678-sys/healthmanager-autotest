[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "healthmanager-api-test"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1", "pytest==9.1.1"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests/framework"]
addopts = "-q --strict-markers"
markers = ["smoke: product smoke tests"]
